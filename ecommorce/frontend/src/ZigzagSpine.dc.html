<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ ref_root }}" style="position:relative;width:100%;height:100%;pointer-events:none">
  <svg viewBox="0 0 140 1200" preserveAspectRatio="none" style="width:100%;height:100%;display:block;overflow:visible">
    <path data-ink="" fill="none" stroke="var(--rd-ink,#43263C)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" pathLength="1" d="M70 8 L18 128 L122 268 L18 408 L122 548 L18 688 L122 828 L18 968 L70 1128 L70 1192"></path>
    <path data-fill="" fill="none" stroke="var(--rd-yellow,#FFD93B)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" pathLength="1" d="M70 8 L18 128 L122 268 L18 408 L122 548 L18 688 L122 828 L18 968 L70 1128 L70 1192"></path>
  </svg>
  <div data-bean="" style="position:absolute;top:100%;left:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:999px;background:var(--rd-pink,#F76D9E);border:3px solid var(--rd-ink,#43263C)"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:600}}">
class Component extends DCLogic {
  constructor(p) { super(p); this.root = React.createRef(); }
  componentDidMount() { this.wire(); }
  componentWillUnmount() { clearTimeout(this._t); if (this.ctx) this.ctx.revert(); }
  wire() {
    const g = window.gsap, el = this.root.current;
    if (!g || !window.ScrollTrigger || !el) { this._t = setTimeout(() => this.wire(), 180); return; }
    this.ctx = g.context(function () {
      const tl = g.timeline({ scrollTrigger: { trigger: el, start: 'top 90%', end: 'bottom 62%', scrub: .5 } });
      tl.fromTo(el.querySelectorAll('[data-ink],[data-fill]'),
        { strokeDasharray: 1, strokeDashoffset: 1 },
        { strokeDashoffset: 0, duration: 1, ease: 'none', immediateRender: false }, 0);
      tl.fromTo(el.querySelectorAll('[data-bean]'), { top: '0%' }, { top: '100%', duration: 1, ease: 'none', immediateRender: false }, 0);
    }, el);
  }
  renderVals() { return { ref_root: this.root }; }
}
</script>
</body>
</html>
