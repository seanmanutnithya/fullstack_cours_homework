<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet><script src="./image-slot.js"></script></helmet>
      <article
        data-cat=""
        ref="{{ ref_root }}"
        onClick="{{ go }}"
        style="
          position: relative;
          display: flex;
          align-items: stretch;
          gap: 14px;
          height: 100%;
          padding: 14px;
          border: 2.5px solid var(--rd-ink, #43263c);
          border-radius: 24px;
          background: var(--rd-white, #fff);
          box-shadow: 0 7px 0 -1px rgba(67, 38, 60, 0.15);
          cursor: pointer;
          overflow: hidden;
          will-change: transform;
        ">
        <div
          data-photo=""
          style="
            position: relative;
            flex: none;
            width: 82px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--rd-ink, #43263c);
            background: var(--rd-pink-soft, #ffd3e2);
            will-change: transform;
          ">
          <image-slot
            id="{{ slotId }}"
            shape="rect"
            placeholder="{{ photoHint }}"></image-slot>
        </div>
        <div
          style="
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
            flex: 1 1 auto;
          ">
          <h3
            style="
              margin: 0;
              font:
                800 17px/1.1 &quot;Baloo 2&quot;,
                system-ui;
              color: var(--rd-ink, #43263c);
              letter-spacing: -0.005em;
              text-transform: uppercase;
            ">
            {{ title }}
          </h3>
          <p
            style="
              margin: 0;
              font:
                400 12.5px/1.4 &quot;Nunito Sans&quot;,
                system-ui;
              color: var(--rd-ink-soft, #7a5a6f);
              text-wrap: pretty;
            ">
            {{ desc }}
          </p>
          <span
            data-link=""
            style="
              display: inline-flex;
              align-items: center;
              gap: 5px;
              margin-top: auto;
              padding-top: 6px;
              font:
                800 11px/1 &quot;Nunito Sans&quot;,
                system-ui;
              letter-spacing: 0.11em;
              text-transform: uppercase;
              color: var(--rd-pink-deep, #e23c77);
            "
            >Browse <span data-arrow="">&#8594;</span></span
          >
        </div>
      </article>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":300,"height":140},"item":{"editor":null,"tsType":"{id:string,title:string,desc:string,slotId:string}"},"onSelect":{"editor":null,"tsType":"(item)=&gt;void"}}'>
      class Component extends DCLogic {
        constructor(p) { super(p); this.root = React.createRef(); }
        componentDidMount() { this.wire(); }
        componentWillUnmount() {
          clearTimeout(this._t);
          const el = this.root.current;
          if (el && this._enter) { el.removeEventListener('mouseenter', this._enter); el.removeEventListener('mouseleave', this._leave); }
          if (this.tl) this.tl.kill();
        }
        wire() {
          const g = window.gsap, el = this.root.current;
          if (!g || !el) { this._t = setTimeout(() => this.wire(), 180); return; }
          const q = g.utils.selector(el);
          this.tl = g.timeline({ paused: true, defaults: { ease: 'power3.out' } })
            .to(el, { y: -7, rotate: .8, backgroundColor: 'var(--rd-yellow-soft,#FFF0AD)', duration: .34 }, 0)
            .to(q('[data-photo]'), { scale: 1.09, rotate: -3, duration: .5 }, 0)
            .to(q('[data-arrow]'), { x: 6, duration: .35 }, 0);
          this._enter = () => this.tl.play();
          this._leave = () => this.tl.reverse();
          el.addEventListener('mouseenter', this._enter);
          el.addEventListener('mouseleave', this._leave);
        }
        renderVals() {
          const it = this.props.item || {};
          return {
            ref_root: this.root,
            title: it.title, desc: it.desc,
            slotId: it.slotId || ('cat-' + (it.id || 'x')),
            photoHint: it.title || 'Drop a photo',
            go: () => { if (this.props.onSelect) this.props.onSelect(it); }
          };
        }
      }
    </script>
  </body>
</html>
