<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./image-slot.js"></script></helmet>
<article data-spot="" ref="{{ ref_root }}" onClick="{{ order }}" style="position:relative;display:flex;flex-direction:column;gap:12px;height:100%;padding:22px 22px 20px;border:3px solid var(--rd-ink,#43263C);border-radius:30px;background:{{ bg }};box-shadow:0 10px 0 -2px rgba(67,38,60,.22);cursor:pointer;overflow:hidden;will-change:transform">
  <div data-sheen="" style="position:absolute;top:-40%;left:-60%;width:45%;height:180%;transform:rotate(18deg);background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%);pointer-events:none"></div>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
    <span style="display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:999px;border:2.5px solid var(--rd-ink,#43263C);background:var(--rd-cream,#FDF2E4);font:800 15px/1 'Baloo 2',system-ui;color:var(--rd-ink,#43263C)">{{ n }}</span>
    <span style="padding:6px 12px 5px;border-radius:999px;border:2.5px solid var(--rd-ink,#43263C);background:var(--rd-cream,#FDF2E4);font:800 10.5px/1 'Nunito Sans',system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--rd-ink,#43263C)">{{ kind }}</span>
  </div>
  <div data-photo="" style="position:relative;height:150px;border-radius:20px;border:2.5px solid var(--rd-ink,#43263C);overflow:hidden;background:var(--rd-cream,#FDF2E4);will-change:transform">
    <image-slot id="{{ slotId }}" shape="rect" placeholder="{{ photoHint }}"></image-slot>
  </div>
  <h3 style="margin:0;font:800 27px/1.02 'Baloo 2',system-ui;letter-spacing:-.015em;color:var(--rd-ink,#43263C);text-wrap:balance">{{ name }}</h3>
  <p style="margin:0;font:400 13.5px/1.5 'Nunito Sans',system-ui;color:var(--rd-ink,#43263C);opacity:.82;text-wrap:pretty;flex:1 1 auto">{{ desc }}</p>
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-top:2px">
    <div style="display:flex;flex-direction:column;gap:1px">
      <span style="font:700 10px/1 'Nunito Sans',system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--rd-ink,#43263C);opacity:.6">From</span>
      <span style="font:800 30px/1 'Baloo 2',system-ui;color:var(--rd-ink,#43263C)">{{ price }}</span>
    </div>
    <span data-arrow="" style="display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:999px;border:2.5px solid var(--rd-ink,#43263C);background:var(--rd-ink,#43263C);color:var(--rd-yellow,#FFD93B);font:800 19px/1 'Nunito Sans',system-ui">&#8594;</span>
  </div>
  <div data-cue="" style="position:absolute;left:0;right:0;bottom:0;transform:translateY(101%);display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 14px;background:var(--rd-ink,#43263C);pointer-events:none">
    <span style="display:inline-flex;width:7px;height:7px;border-radius:999px;background:var(--rd-yellow,#FFD93B)"></span>
    <span style="font:800 11.5px/1 'Nunito Sans',system-ui;letter-spacing:.11em;text-transform:uppercase;color:var(--rd-yellow,#FFD93B)">Click to order &#183; pay in 2 taps</span>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:520},&quot;item&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{n:string,kind:string,name:string,desc:string,price:number,slotId:string}&quot;},&quot;onOrder&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(item)=&gt;void&quot;}}">
class Component extends DCLogic {
  constructor(p) { super(p); this.root = React.createRef(); }
  componentDidMount() { this.wire(); }
  componentWillUnmount() {
    clearTimeout(this._t);
    const el = this.root.current;
    if (el && this._enter) { el.removeEventListener('mouseenter', this._enter); el.removeEventListener('mouseleave', this._leave); }
    if (this.tl) this.tl.kill();
  }
  wire() {
    const g = window.gsap, el = this.root.current;
    if (!g || !el) { this._t = setTimeout(() => this.wire(), 180); return; }
    const q = g.utils.selector(el);
    g.set(q('[data-sheen]'), { xPercent: 0 });
    this.tl = g.timeline({ paused: true, defaults: { ease: 'power3.out' } })
      .to(el, { scale: 1.045, y: -10, boxShadow: '0 30px 54px -18px rgba(67,38,60,.5)', duration: .38 }, 0)
      .to(q('[data-photo]'), { scale: 1.05, rotate: -1.4, duration: .5 }, 0)
      .to(q('[data-arrow]'), { rotate: -45, scale: 1.12, duration: .45, ease: 'back.out(2)' }, 0)
      .to(q('[data-cue]'), { y: '0%', duration: .38, ease: 'back.out(1.6)' }, .05)
      .fromTo(q('[data-sheen]'), { xPercent: 0, opacity: 0 }, { xPercent: 460, opacity: 1, duration: .9, ease: 'power2.inOut' }, 0);
    this._enter = () => this.tl.play();
    this._leave = () => this.tl.reverse();
    el.addEventListener('mouseenter', this._enter);
    el.addEventListener('mouseleave', this._leave);
  }
  renderVals() {
    const it = this.props.item || {};
    return {
      ref_root: this.root,
      n: it.n, kind: it.kind, name: it.name, desc: it.desc,
      bg: it.bg || 'var(--rd-violet-soft,#C9BEF5)',
      price: it.price != null ? '$' + Number(it.price).toFixed(2) : '',
      slotId: it.slotId || ('spot-' + (it.id || 'x')),
      photoHint: 'Drop a photo of ' + (it.name || 'this item'),
      order: () => { if (this.props.onOrder) this.props.onOrder(it); }
    };
  }
}
</script>
</body>
</html>
