<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>@keyframes rd-sticker-spin{to{transform:rotate(360deg)}}</style></helmet>
<div style="position:relative;width:100%;height:100%">
  <svg ref="{{ ref_svg }}" viewBox="0 0 120 120" style="width:100%;height:100%;display:block;animation:rd-sticker-spin {{ dur }} linear infinite">
    <defs>
      <path id="{{ pid }}" fill="none" d="M60,60 m-45,0 a45,45 0 1,1 90,0 a45,45 0 1,1 -90,0"></path>
    </defs>
    <circle cx="60" cy="60" r="57" fill="{{ bg }}" stroke="var(--rd-ink,#43263C)" stroke-width="3"></circle>
    <circle cx="60" cy="60" r="34" fill="none" stroke="var(--rd-ink,#43263C)" stroke-width="1.6" stroke-dasharray="3 5" opacity=".55"></circle>
  </svg>
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
    <span style="font:800 19px/1 'Baloo 2',system-ui;letter-spacing:-.01em;color:var(--rd-ink,#43263C);text-align:center;max-width:52%">{{ center }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:150,&quot;height&quot;:150},&quot;ring&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;fresh daily&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;center&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;6AM&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFD93B&quot;,&quot;options&quot;:[&quot;#FFD93B&quot;,&quot;#F76D9E&quot;,&quot;#C9BEF5&quot;,&quot;#FFAE94&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;duration&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:26,&quot;min&quot;:8,&quot;max&quot;:60,&quot;step&quot;:2,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
const SVGNS = 'http://www.w3.org/2000/svg';
class Component extends DCLogic {
  constructor(p) { super(p); this.svg = React.createRef(); this.pid = 'rdsk' + Math.random().toString(36).slice(2, 8); }
  componentDidMount() { this.paint(); }
  componentDidUpdate() { this.paint(); }
  ringText() {
    const t = (this.props.ring || 'fresh daily') + ' \u00b7 ';
    return (t + t + t).toUpperCase();
  }
  paint() {
    const svg = this.svg.current;
    if (!svg) return;
    const old = svg.querySelector('[data-ring]');
    if (old) old.remove();
    const t = document.createElementNS(SVGNS, 'text');
    t.setAttribute('data-ring', '');
    t.setAttribute('fill', 'var(--rd-ink,#43263C)');
    t.setAttribute('style', "font:800 12px 'Nunito Sans',system-ui;letter-spacing:.22em");
    const tp = document.createElementNS(SVGNS, 'textPath');
    tp.setAttribute('href', '#' + this.pid);
    tp.setAttribute('startOffset', '0%');
    tp.textContent = this.ringText();
    t.appendChild(tp);
    svg.appendChild(t);
  }
  renderVals() {
    return {
      ref_svg: this.svg,
      pid: this.pid,
      center: this.props.center || '2026',
      bg: this.props.bg || 'var(--rd-yellow,#FFD93B)',
      dur: (this.props.duration || 26) + 's'
    };
  }
}
</script>
</body>
</html>
